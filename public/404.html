<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Correndo para Deus — Redirecionando...</title>
    <script>
      // Single Page App redirect for GitHub Pages project sites
      // Adapta acessos diretos de caminhos para rotas com Hash
      var repoName = 'site-para-jovem-';
      var path = window.location.pathname;
      var repoIndex = path.indexOf('/' + repoName);
      var subPath = repoIndex !== -1 ? path.substring(repoIndex + repoName.length + 1) : path;
      subPath = subPath.replace(/^\/+/, '');

      var targetBase = repoIndex !== -1 ? '/' + repoName + '/' : '/';
      var targetHash = subPath ? '#/' + subPath : '#/';

      window.location.replace(
        window.location.origin + targetBase + targetHash + window.location.search
      );
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
